name: daily-push
on:
  schedule:
     - cron: '20 20 * * *'  # TODO: 動作確認用の一時設定。確認後 '0 23 * * *'（8:00 JST）に戻す
  workflow_dispatch:       # 手動実行用（テスト時に便利）
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run .
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}