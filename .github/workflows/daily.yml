name: daily-push
on:
  # 定期実行は cron-job.org から workflow_dispatch API を叩いて行う。
  # GitHub の schedule は発火が遅延・スキップされるため使わない。
  workflow_dispatch:       # cron-job.org からのトリガ + 手動実行用
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run .
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}